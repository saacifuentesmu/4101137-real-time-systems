<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<text x="190.0" y="30.0" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Flash, one west flash</text>
<rect x="60.0" y="50.0" width="260.0" height="130.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="190.0" y="109.0" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PROCPU image</text>
<text x="190.0" y="135.0" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">0x00_0000</text>
<text x="190.0" y="222.0" text-anchor="middle" font-size="30" font-weight="700" fill="#475569">⋮</text>
<rect x="60.0" y="250.0" width="260.0" height="110.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="190.0" y="299.0" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">APPCPU image</text>
<text x="190.0" y="325.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">0x2C_0000</text>
<rect x="360.0" y="40.0" width="820.0" height="64.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="380.0" y="80.0" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">1  The ROM boots PROCPU's image (ESP simple boot)</text>
<rect x="360.0" y="130.0" width="820.0" height="64.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="380.0" y="170.0" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">2  PROCPU's Zephyr starts and, with IPM on, reads APPCPU's image</text>
<rect x="360.0" y="220.0" width="820.0" height="64.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="380.0" y="260.0" text-anchor="start" font-size="20" font-weight="700" fill="#0f172a">3  It copies that image's RAM parts and maps its flash code</text>
<rect x="360.0" y="310.0" width="820.0" height="64.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="380.0" y="350.0" text-anchor="start" font-size="20" font-weight="700" fill="#2563eb">4  It releases APPCPU: a second Zephyr, its own scheduler</text>
<line x1="320.0" y1="110.0" x2="358.0" y2="72.0" stroke="#475569" stroke-width="3" marker-end="url(#ar-muted)"/>
<line x1="320.0" y1="300.0" x2="358.0" y2="252.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-c2)"/>
<text x="60.0" y="410.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">No shared kernel: each core schedules only its own threads.</text>
</svg>
