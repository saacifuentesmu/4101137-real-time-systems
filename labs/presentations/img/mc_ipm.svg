<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<rect x="40.0" y="170.0" width="220.0" height="90.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="150.0" y="223.0" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">PROCPU</text>
<rect x="940.0" y="170.0" width="220.0" height="90.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1050.0" y="223.0" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">APPCPU</text>
<rect x="360.0" y="60.0" width="480.0" height="290.0" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="600.0" y="92.0" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">shared RAM, 1 KB</text>
<rect x="390.0" y="112.0" width="420.0" height="80.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="600.0" y="146.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">PROCPU → APPCPU</text>
<text x="600.0" y="171.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">512 B, one slot: set, clear</text>
<rect x="390.0" y="222.0" width="420.0" height="80.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="256.0" text-anchor="middle" font-size="21" font-weight="700" fill="#2563eb">APPCPU → PROCPU</text>
<text x="600.0" y="281.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0f172a">512 B, one slot: status</text>
<text x="600.0" y="334.0" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">+ a lock and the message ID</text>
<line x1="940.0" y1="250.0" x2="812.0" y2="262.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-c2)"/>
<text x="1050.0" y="300.0" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">1  lock, copy, unlock</text>
<polyline points="1050.0,170.0 1050.0,26.0 150.0,26.0 150.0,166.0" fill="none" stroke="#db2777" stroke-width="3" marker-end="url(#ar-c8)"/>
<text x="600.0" y="18.0" text-anchor="middle" font-size="19" font-weight="700" fill="#db2777">2  cross-core interrupt</text>
<line x1="388.0" y1="262.0" x2="262.0" y2="240.0" stroke="#db2777" stroke-width="3" marker-end="url(#ar-c8)"/>
<text x="150.0" y="300.0" text-anchor="middle" font-size="19" font-weight="700" fill="#db2777">3  handler copies</text>
<text x="150.0" y="324.0" text-anchor="middle" font-size="19" font-weight="700" fill="#db2777">and returns</text>
<text x="600.0" y="392.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">A second send before the handler copies replaces the first.</text>
<text x="600.0" y="420.0" text-anchor="middle" font-size="21" font-weight="400" fill="#0f172a">So every message carries the full state.</text>
</svg>
