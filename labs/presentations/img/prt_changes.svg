<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff"/><rect width="4" height="10" fill="#cbd5e1"/></pattern></defs>
<text x="60.0" y="34.0" text-anchor="start" font-size="22" font-weight="800" fill="#475569">stock kernel</text>
<text x="660.0" y="34.0" text-anchor="start" font-size="22" font-weight="800" fill="#0f172a">PREEMPT_RT</text>
<rect x="60.0" y="52.0" width="440.0" height="64.0" rx="10" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="280.0" y="79.0" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">IRQ handler</text>
<text x="280.0" y="104.0" text-anchor="middle" font-size="17" font-weight="400" fill="#e2e8f0">runs above every thread</text>
<line x1="512.0" y1="84.0" x2="646.0" y2="84.0" stroke="#0f172a" stroke-width="3" marker-end="url(#ar-ink)"/>
<rect x="660.0" y="52.0" width="480.0" height="64.0" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="900.0" y="79.0" text-anchor="middle" font-size="21" font-weight="700" fill="#db2777">IRQ thread</text>
<text x="900.0" y="104.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">irq/NN-eth0 · SCHED_FIFO 50</text>
<rect x="60.0" y="130.0" width="440.0" height="64.0" rx="10" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="280.0" y="157.0" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">spinlock</text>
<text x="280.0" y="182.0" text-anchor="middle" font-size="17" font-weight="400" fill="#e2e8f0">spins, preemption off</text>
<line x1="512.0" y1="162.0" x2="646.0" y2="162.0" stroke="#0f172a" stroke-width="3" marker-end="url(#ar-ink)"/>
<rect x="660.0" y="130.0" width="480.0" height="64.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="900.0" y="157.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">rtmutex</text>
<text x="900.0" y="182.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">sleeps · inherits priority (week 6)</text>
<rect x="60.0" y="208.0" width="440.0" height="64.0" rx="10" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="280.0" y="235.0" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">softirq</text>
<text x="280.0" y="260.0" text-anchor="middle" font-size="17" font-weight="400" fill="#e2e8f0">runs on the way out of an IRQ</text>
<line x1="512.0" y1="240.0" x2="646.0" y2="240.0" stroke="#0f172a" stroke-width="3" marker-end="url(#ar-ink)"/>
<rect x="660.0" y="208.0" width="480.0" height="64.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="900.0" y="235.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">softirq in a thread</text>
<text x="900.0" y="260.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">scheduled like the rest</text>
<line x1="60.0" y1="300.0" x2="1140.0" y2="300.0" stroke="#cbd5e1" stroke-width="2"/>
<text x="60.0" y="334.0" text-anchor="start" font-size="21" font-weight="800" fill="#0f172a">Still not preemptible, even on PREEMPT_RT: the floor under every max</text>
<rect x="60.0" y="352.0" width="260.0" height="84.0" rx="10" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="190.0" y="389.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">hard-IRQ entry</text>
<text x="190.0" y="413.0" text-anchor="middle" font-size="16" font-weight="400" fill="#e2e8f0">only wakes the IRQ thread</text>
<rect x="334.0" y="352.0" width="260.0" height="84.0" rx="10" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="464.0" y="389.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">timer tick, IPIs</text>
<text x="464.0" y="413.0" text-anchor="middle" font-size="16" font-weight="400" fill="#e2e8f0">stay in hard-IRQ context</text>
<rect x="608.0" y="352.0" width="260.0" height="84.0" rx="10" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="738.0" y="389.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">raw spinlocks</text>
<text x="738.0" y="413.0" text-anchor="middle" font-size="16" font-weight="400" fill="#e2e8f0">scheduler, timers, IRQ core</text>
<rect x="882.0" y="352.0" width="258.0" height="84.0" rx="10" fill="url(#hatch)" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="902.0" y="368.0" width="218.0" height="52.0" rx="6" fill="#fff" stroke="none" stroke-width="0"/>
<text x="1011.0" y="389.0" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">firmware, hardware</text>
<text x="1011.0" y="412.0" text-anchor="middle" font-size="16" font-weight="400" fill="#475569">SMIs, caches: below Linux</text>
<text x="60.0" y="470.0" text-anchor="start" font-size="18" font-weight="400" fill="#0f172a">The dark three are µs, and the kernel's job to keep short. The hatched one no kernel can fix: measure it (hwlatdetect).</text>
<text x="60.0" y="498.0" text-anchor="start" font-size="18" font-weight="400" fill="#475569">In mainline Linux since 6.12 (2024): a build option, not a patch.</text>
</svg>
