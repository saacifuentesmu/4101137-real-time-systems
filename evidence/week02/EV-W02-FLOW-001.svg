<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1300" width="1500" height="1300"
     font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Lab 02 — Flujo del superloop en la NUCLEO-G474RE</title>
  <desc>Diagrama de diez bloques con el orden fijo del superloop, las ISR de temporizador y flujo, y los pines de instrumentación.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0969da"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#bc4c00"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 30px; font-weight: 750; fill: #1f2328; }
    .subtitle { font-size: 16px; fill: #57606a; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane-title { font-size: 17px; font-weight: 700; fill: #57606a; letter-spacing: 1px; }
    .box { fill: #ffffff; stroke: #0969da; stroke-width: 2.2; filter: url(#shadow); }
    .isr { fill: #fff8f0; stroke: #bc4c00; stroke-width: 2.2; filter: url(#shadow); }
    .decision { fill: #fffdf2; stroke: #9a6700; stroke-width: 2.2; filter: url(#shadow); }
    .num-blue { fill: #0969da; }
    .num-orange { fill: #bc4c00; }
    .num-gold { fill: #9a6700; }
    .num { font-size: 16px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 19px; font-weight: 750; fill: #1f2328; text-anchor: middle; }
    .body { font-size: 15px; fill: #57606a; text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .pin { font-size: 14px; font-weight: 700; fill: #0969da; text-anchor: middle; }
    .pin-orange { font-size: 14px; font-weight: 700; fill: #bc4c00; text-anchor: middle; }
    .flow { fill: none; stroke: #0969da; stroke-width: 3; marker-end: url(#arrow-blue); }
    .loop { fill: none; stroke: #57606a; stroke-width: 2.5; marker-end: url(#arrow-gray); }
    .async { fill: none; stroke: #bc4c00; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-orange); }
    .label { font-size: 14px; font-weight: 700; fill: #57606a; }
    .yes { font-size: 14px; font-weight: 750; fill: #1a7f37; }
    .no { font-size: 14px; font-weight: 750; fill: #cf222e; }
    .note { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .note-head { font-size: 15px; font-weight: 750; fill: #1f2328; }
    .note-body { font-size: 14px; fill: #57606a; }
  </style>

  <rect width="1500" height="1300" fill="#ffffff"/>
  <text class="title" x="60" y="52">Lab 02 — Flujo del superloop</text>
  <text class="subtitle" x="60" y="82">Juan Pablo Vargas Córdoba · NUCLEO-G474RE · firmware/superloop · sin planificador</text>

  <!-- Execution lanes -->
  <rect class="lane" x="40" y="115" width="340" height="1050" rx="14"/>
  <rect class="lane" x="410" y="115" width="680" height="1155" rx="14"/>
  <rect class="lane" x="1120" y="115" width="340" height="1050" rx="14"/>
  <text class="lane-title" x="210" y="148" text-anchor="middle">ISR DE TEMPORIZADOR</text>
  <text class="lane-title" x="750" y="148" text-anchor="middle">FLUJO PRINCIPAL · while (1)</text>
  <text class="lane-title" x="1290" y="148" text-anchor="middle">ISR DE FLUJO</text>

  <!-- 1: boot -->
  <rect class="box" x="500" y="180" width="500" height="96" rx="48"/>
  <circle class="num-blue" cx="526" cy="206" r="18"/>
  <text class="num" x="526" y="207">1</text>
  <text class="head" x="750" y="216">Inicio e inicialización</text>
  <text class="body mono" x="750" y="244">init_hw() · k_timer_start(..., 1 ms)</text>

  <!-- 3: console -->
  <rect class="box" x="500" y="330" width="500" height="86" rx="10"/>
  <circle class="num-blue" cx="526" cy="356" r="18"/>
  <text class="num" x="526" y="357">3</text>
  <text class="head mono" x="750" y="365">task_console()</text>
  <text class="pin" x="750" y="392">instrumentación D5 / PB4 · firm</text>

  <!-- 4: display -->
  <rect class="box" x="500" y="456" width="500" height="86" rx="10"/>
  <circle class="num-blue" cx="526" cy="482" r="18"/>
  <text class="num" x="526" y="483">4</text>
  <text class="head mono" x="750" y="491">task_display()</text>
  <text class="pin" x="750" y="518">instrumentación D8 / PA9 · soft</text>

  <!-- 5: telemetry -->
  <rect class="box" x="500" y="582" width="500" height="86" rx="10"/>
  <circle class="num-blue" cx="526" cy="608" r="18"/>
  <text class="num" x="526" y="609">5</text>
  <text class="head mono" x="750" y="617">task_telemetry()</text>
  <text class="pin" x="750" y="644">instrumentación D6 / PB10 · soft · 1 Hz</text>

  <!-- 6: pending decision -->
  <path class="decision" d="M750 704 L1010 774 L750 844 L490 774 Z"/>
  <circle class="num-gold" cx="548" cy="743" r="18"/>
  <text class="num" x="548" y="744">6</text>
  <text class="head mono" x="750" y="763">ticks_pending &gt; 0?</text>
  <text class="body" x="750" y="791">Sí: decrementa exactamente un tick</text>
  <text class="body" x="750" y="814">No: continúa con el flujo</text>

  <!-- 7: sampling -->
  <rect class="box" x="500" y="886" width="500" height="88" rx="10"/>
  <circle class="num-blue" cx="526" cy="912" r="18"/>
  <text class="num" x="526" y="913">7</text>
  <text class="head mono" x="750" y="922">task_sampling()</text>
  <text class="pin" x="750" y="950">instrumentación D3 / PB3 · hard · 1 kHz</text>

  <!-- 8: control divider decision and action -->
  <path class="decision" d="M750 1000 L1022 1068 L750 1136 L478 1068 Z"/>
  <circle class="num-gold" cx="538" cy="1038" r="18"/>
  <text class="num" x="538" y="1039">8</text>
  <text class="head mono" x="750" y="1054">++control_div ≥ 10?</text>
  <text class="body mono" x="750" y="1080">Sí: control_div=0; task_control()</text>
  <text class="pin" x="750" y="1106">control: D4 / PB5 · hard · 10 ms</text>

  <!-- 10: flow batch, positioned below central lane -->
  <rect class="box" x="500" y="1178" width="500" height="86" rx="10"/>
  <circle class="num-blue" cx="526" cy="1204" r="18"/>
  <text class="num" x="526" y="1205">10</text>
  <text class="head mono" x="750" y="1213">task_flow_batch()</text>
  <text class="pin" x="750" y="1240">instrumentación D7 / PA8 · cada 100 pulsos</text>

  <!-- 2: timer ISR -->
  <rect class="isr" x="75" y="620" width="270" height="130" rx="12"/>
  <circle class="num-orange" cx="103" cy="648" r="18"/>
  <text class="num" x="103" y="649">2</text>
  <text class="head mono" x="210" y="660">tick_isr()</text>
  <text class="body" x="210" y="690">Interrupción cada 1 ms</text>
  <text class="body mono" x="210" y="717">ticks_pending++</text>
  <text class="pin-orange" x="210" y="740">actualiza backlog_peak</text>

  <!-- 9: flow ISR -->
  <rect class="isr" x="1155" y="910" width="270" height="142" rx="12"/>
  <circle class="num-orange" cx="1183" cy="938" r="18"/>
  <text class="num" x="1183" y="939">9</text>
  <text class="head mono" x="1290" y="950">flow_isr()</text>
  <text class="body" x="1290" y="980">Flanco activo en D9 / PC7</text>
  <text class="body mono" x="1290" y="1007">flow_pulses++</text>
  <text class="pin-orange" x="1290" y="1032">entrada asíncrona</text>

  <!-- Main sequential arrows -->
  <path class="flow" d="M750 276 V328"/>
  <path class="flow" d="M750 416 V454"/>
  <path class="flow" d="M750 542 V580"/>
  <path class="flow" d="M750 668 V702"/>
  <path class="flow" d="M750 844 V884"/>
  <path class="flow" d="M750 974 V998"/>
  <path class="flow" d="M750 1136 V1176"/>

  <!-- No branch from pending decision to flow batch -->
  <path class="flow" d="M1010 774 H1060 V1221 H1002"/>
  <text class="no" x="1024" y="761">NO</text>
  <text class="yes" x="768" y="870">SÍ</text>
  <text class="label" x="774" y="1164">sí o no</text>

  <!-- Loop back: fixed order, one pass at a time -->
  <path class="loop" d="M500 1221 H438 V373 H498"/>
  <text class="label" x="421" y="810" transform="rotate(-90 421 810)">repetir while (1) · orden fijo</text>

  <!-- Asynchronous data hand-offs -->
  <path class="async" d="M345 685 H430 V774 H488"/>
  <text class="pin-orange" x="421" y="670">contador atómico</text>
  <path class="async" d="M1290 1052 V1221 H1002"/>
  <text class="pin-orange" x="1268" y="1120" transform="rotate(-90 1268 1120)">contador atómico</text>

  <!-- External triggers -->
  <path class="async" d="M210 180 V618"/>
  <text class="pin-orange" x="194" y="414" transform="rotate(-90 194 414)">temporizador hardware · 1 kHz</text>
  <path class="async" d="M1290 835 V908"/>
  <text class="pin-orange" x="1290" y="814">pulso del sensor de flujo</text>

  <!-- Footer legend overlays lower lane edges intentionally outside boxes -->
  <rect class="note" x="55" y="1190" width="350" height="78" rx="10"/>
  <text class="note-head" x="75" y="1217">Lectura del diagrama</text>
  <path class="flow" d="M75 1240 H125"/>
  <text class="note-body" x="140" y="1245">orden del superloop</text>
  <path class="async" d="M75 1260 H125"/>
  <text class="note-body" x="140" y="1265">evento ISR / dato compartido</text>

  <rect class="note" x="1125" y="1190" width="330" height="78" rx="10"/>
  <text class="note-head" x="1145" y="1217">Propiedad observada</text>
  <text class="note-body" x="1145" y="1242">Una tarea bloqueante retrasa todas</text>
  <text class="note-body" x="1145" y="1262">las que aparecen después en el ciclo.</text>
</svg>
